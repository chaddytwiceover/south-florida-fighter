name: Game validation
on:
  pull_request:
  push:
    branches: [main, fix/mobile-fps-renderer]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Check development desktop and mobile
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/dev.log 2>&1 &
          curl -fs --retry 60 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/ >/dev/null || { cat /tmp/dev.log; exit 1; }
          node scripts/browser-smoke.mjs http://127.0.0.1:8080 test-results/dev.png
          node scripts/gameplay-smoke.mjs http://127.0.0.1:8080 test-results/gameplay-dev
      - name: Check production desktop and mobile
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          curl -fs --retry 60 --retry-connrefused --retry-delay 1 http://127.0.0.1:8081/ >/dev/null || { cat /tmp/preview.log; exit 1; }
          node scripts/browser-smoke.mjs http://127.0.0.1:8081 test-results/prod.png --baseline test-results/dev.json
          node scripts/gameplay-smoke.mjs http://127.0.0.1:8081 test-results/gameplay-prod
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
